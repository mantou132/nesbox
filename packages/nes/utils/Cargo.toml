[package]
name = "nesbox_utils"
version = "0.0.3"
edition = "2021"
description = "Quickly develop NESBox games"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.10", default-features = false }
bincode = "1.3.3"
nesbox_utils_macro = { path = "../utils_macro", version = "0.0.3" }
qoi = "0.4.0"
rand = "0.8"
wasm-bindgen = "=0.2.100"
