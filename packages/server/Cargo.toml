[package]
name = "server"
version = "0.1.0"
edition = "2021"
default-run = "server"

[dependencies]
actix-cors = "0.7"
actix-web = "4"
async-stream = "0.3"
chrono = "0.4.19"
data-encoding = "2.3.2"
derive_builder = "0.20"
diesel = { version = "2.3", features = ["chrono", "postgres", "r2d2", "serde_json"] }
dotenv = "0.15.0"
env_logger = "0.11"
futures = "0.3.21"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
juniper = "0.16"
juniper_actix = { version = "0.6", features = ["subscriptions"] }
juniper_graphql_ws = "0.4"
lazy_static = "1.4.0"
log = "0.4"
openssl = "*"
openssl-probe = "0.2.1"
pulldown-cmark = "0.13"
reqwest = { version = "0.11", features = ["json"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
webrtc = "0.11"
